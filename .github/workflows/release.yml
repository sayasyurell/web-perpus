name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Node.exe Portable
        run: |
          mkdir -p build-portable
          curl -sL -o build-portable/node.exe https://nodejs.org/dist/v20.18.0/win-x64/node.exe
          echo "Node.exe size: $(ls -lh build-portable/node.exe | awk '{print $5}')"

      - name: Copy Project Files
        run: |
          mkdir -p build-portable/app
          cp server.js db.js package.json package-lock.json .gitignore build-portable/app/
          cp -r public routes middleware utils build-portable/app/
          echo "Files copied:"
          ls -la build-portable/app/

      - name: Install Dependencies
        run: |
          cd build-portable/app
          npm install --omit=dev --ignore-scripts --no-audit --no-fund 2>&1 | tail -5
          echo "Dependencies installed:"
          ls node_modules/ | head -10

      - name: Create start.bat
        run: |
          cat > build-portable/start.bat << 'EOF'
          @echo off
          title Perpustakaan SMPN 1 Taman
          cd /d "%~dp0"
          echo.
          echo  ========================================
          echo   PERPUSTAKAAN SMPN 1 TAMAN SIDOARJO
          echo  ========================================
          echo.
          echo  Server berjalan di: http://localhost:3000
          echo  Jangan tutup jendela ini saat memakai aplikasi.
          echo  Tekan Ctrl+C untuk mematikan server.
          echo.
          timeout /t 2 /nobreak >nul
          start "" http://localhost:3000
          node.exe app\server.js
          pause
          EOF

      - name: Create ZIP
        run: |
          cd build-portable
          zip -r -q -9 ../app-${{ github.ref_name }}.zip . \
            -x "*/node_modules/*/test/*" \
               "*/node_modules/*/tests/*" \
               "*/node_modules/*/docs/*" \
               "*/node_modules/*/*.md" \
               "*/node_modules/*/*.txt" \
               "*/node_modules/*/*.map" \
               "*/node_modules/*/*.d.ts" \
               "*/node_modules/*/.eslint*" \
               "*/node_modules/*/.editorconfig" \
               "*/node_modules/*/.travis.yml" \
               "*/node_modules/*/.github/*" \
               "*/node_modules/*/example/*" \
               "*/node_modules/*/examples/*" \
               "*/node_modules/.bin/*"
          cd ..
          echo "=== File ZIP hasil ==="
          ls -lh app-*.zip
          echo "=== Working directory ==="
          pwd

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/app-${{ github.ref_name }}.zip
          name: "Versi ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 📚 Perpustakaan SMPN 1 Taman Sidoarjo — ${{ github.ref_name }}

            ### 🚀 Cara Pakai
            1. Download **`app-${{ github.ref_name }}.zip`** di bawah
            2. Extract ke folder manapun
            3. Dobel-klik **`start.bat`**
            4. **Password admin muncul di cmd** — catat & simpan
            5. Browser otomatis terbuka di http://localhost:3000
            6. Login → wajib ganti password

            ### 💻 Kebutuhan
            - Windows 10/11 (64-bit)
            - Tidak perlu install Node.js (sudah di-bundle)
            - Offline-ready

            ### 🔒 Keamanan
            - Login + session aman (cookie HttpOnly, SameSite=Strict)
            - Password hashing scrypt
            - Rate limit & CSRF protection
            - XSS & CSV injection protection
            - Backup aman via SQLite native API

            ### 📋 Fitur Lengkap
            - 📖 Kelola Buku (CRUD + Import CSV + barcode ISBN)
            - 👥 Kelola Anggota (CRUD + Import CSV + kartu barcode)
            - 🔄 Peminjaman & Pengembalian otomatis dengan denda
            - 🎯 Mode Scan barcode (auto-detect pinjam/kembali)
            - 📊 Dashboard & Laporan (export CSV + print)
            - ⚙️ Pengaturan (denda, lama pinjam, backup)

            ### ⚠️ Upgrade dari versi lama
            - Copy folder `database/` dari instalasi lama ke folder baru
            - Login dengan password admin baru (ditampilkan di cmd saat pertama start)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}