name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'   # Trigger saat push tag v1.0.0, v1.0.1, dst.

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Download node.exe portable untuk Windows
      - name: Download Node.js Windows binary
        run: |
          mkdir -p build-portable
          curl -L -o build-portable/node.exe https://nodejs.org/dist/v22.20.0/win-x64/node.exe
          chmod +x build-portable/node.exe

      # Copy semua file project ke build-portable/app
      - name: Copy project files
        run: |
          mkdir -p build-portable/app
          cp server.js db.js package.json package-lock.json .gitignore build-portable/app/
          cp -r public routes build-portable/app/

      # Install dependencies production (prebuild binary akan di-handle otomatis)
      - name: Install production dependencies
        run: |
          cd build-portable/app
          npm install --omit=dev --ignore-scripts
          # Ambil prebuilt binary better-sqlite3 untuk Windows
          npm rebuild better-sqlite3 --platform=win32 --arch=x64

      # Buat start.bat
      - name: Create start.bat
        run: |
          cat > build-portable/start.bat << 'EOF'
          @echo off
          title Perpustakaan SMPN 1 Taman
          cd /d "%~dp0"
          echo.
          echo  ========================================
          echo   PERPUSTAKAAN SMPN 1 TAMAN SIDOARJO
          echo  ========================================
          echo.
          echo  Server berjalan di: http://localhost:3000
          echo  Jangan tutup jendela ini saat memakai aplikasi.
          echo  Tekan Ctrl+C untuk mematikan server.
          echo.
          timeout /t 2 /nobreak >nul
          start "" http://localhost:3000
          node.exe app\server.js
          pause
          EOF

      # Zip semua
      - name: Create ZIP
        run: |
          cd build-portable
          zip -r ../web-perpus-portable-${{ github.ref_name }}.zip .

      # Upload otomatis ke GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-${{ github.ref_name }}.zip
          name: "Versi ${{ github.ref_name }}"
          body: |
            ## 📚 Perpustakaan SMPN 1 Taman Sidoarjo — ${{ github.ref_name }}

            ### 🚀 Cara Pakai
            1. Download `app-${{ github.ref_name }}.zip`
            2. Extract ke folder manapun
            3. Dobel-klik `start.bat`
            4. **Password admin muncul di cmd** — catat & simpan
            5. Buka http://localhost:3000 → login → ganti password

            ### 💻 Kebutuhan
            - Windows 10/11 (64-bit)
            - Tidak perlu install Node.js (sudah di-bundle)
            - Offline-ready (semua library lokal)

            ### 📋 Fitur
            - 🔒 Login admin dengan session aman
            - 📖 Kelola Buku (CRUD + Import CSV + barcode ISBN)
            - 👥 Kelola Anggota (CRUD + Import CSV + kartu barcode)
            - 🔄 Peminjaman & Pengembalian otomatis dengan denda
            - 🎯 Mode Scan barcode (auto-detect pinjam/kembali)
            - 📊 Dashboard & Laporan (export CSV + print)
            - ⚙️ Pengaturan (denda, lama pinjam, backup)

            ### 🔄 Changelog Lengkap
            Lihat [commit history](https://github.com/sayasyurell/web-perpus/commits/${{ github.ref_name }}) untuk detail perubahan.
          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}